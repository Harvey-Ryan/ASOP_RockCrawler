# Builds RockCrawler on Windows and, for a version tag (v1.2.3), publishes a GitHub Release
# with RockCrawler-Setup.exe plus the update packages installed copies download.
#
# Release:  git tag v1.0.0 && git push origin v1.0.0
# Every other push / PR: build + tests + self-test only (the build is attached to the run).
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VPK_VERSION: 1.2.161 # keep in step with velopack in requirements.txt
  APP_ID: ASOP.RockCrawler

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building $V"

      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Tests
        run: python tests/test_core.py

      - name: Build and self-test
        shell: pwsh
        run: ./scripts/build.ps1 -Version ${{ steps.v.outputs.version }}

      - name: Keep the build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: RockCrawler-${{ steps.v.outputs.version }}
          path: dist/RockCrawler

      - uses: actions/setup-dotnet@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          dotnet-version: '8.0.x'

      - name: Package and publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install -g vpk --version $env:VPK_VERSION
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $repo = "https://github.com/${{ github.repository }}"
          $v = "${{ steps.v.outputs.version }}"

          # The previous release, so vpk can make a small delta update from it (none yet on the first release).
          vpk download github --repoUrl $repo --token $env:GH_TOKEN
          if ($LASTEXITCODE) { Write-Host "No earlier release to build a delta from." }

          vpk pack --packId $env:APP_ID --packVersion $v --packDir dist\RockCrawler `
            --mainExe RockCrawler.exe --packTitle "ASOP RockCrawler" --packAuthors "ASOP" --icon assets\asop.ico
          if ($LASTEXITCODE) { throw "vpk pack failed" }

          vpk upload github --repoUrl $repo --publish --releaseName "ASOP RockCrawler $v" --tag "v$v" --token $env:GH_TOKEN
          if ($LASTEXITCODE) { throw "vpk upload failed" }

          # The installer again under a friendlier name, for the download link members click.
          Copy-Item "Releases\$env:APP_ID-win-Setup.exe" "Releases\RockCrawler-Setup.exe"
          gh release upload "v$v" "Releases\RockCrawler-Setup.exe" --clobber --repo "${{ github.repository }}"
