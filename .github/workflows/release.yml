# Builds RockCrawler on Windows and publishes a GitHub Release with RockCrawler-Setup.exe
# plus the update packages installed copies download.
#
# Releasing is automatic: bump the version in the VERSION file (e.g. 1.0.3) in a pull
# request. When it merges to main and that version hasn't been released yet, this tags
# main as v1.0.3 and publishes it. Merges that leave VERSION alone just build and test.
#
# Also possible: Actions tab → "Build and release" → Run workflow → type a version, or
# push a tag (git tag v1.0.3 && git push origin v1.0.3).
# Pull requests: build + tests + self-test only (the build is attached to the run).
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 1.0.1 (no "v"). Tags main and publishes it.'
        required: true
        type: string

permissions:
  contents: write

# One release at a time per branch/tag; a newer push waits rather than racing it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  VPK_VERSION: 1.2.161 # keep in step with velopack in requirements.txt
  APP_ID: ASOP.RockCrawler

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Version
        id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PUBLISH=false
          FILE_V="$(tr -d ' \r\n' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"; PUBLISH=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            # Merged to main: release VERSION if it hasn't been released yet.
            if ! [[ "$FILE_V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::VERSION must look like 1.0.3 (got '$FILE_V')."; exit 1; fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$FILE_V" >/dev/null; then
              V="0.0.0-ci.${GITHUB_RUN_NUMBER}"
              echo "v$FILE_V is already released; bump VERSION to release this."
            else
              V="$FILE_V"; PUBLISH=true
            fi
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            V="${INPUT_VERSION#v}"; V="${V// /}"; PUBLISH=true
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then echo "::error::Run releases from the main branch."; exit 1; fi
            if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 1.0.1 (got '$INPUT_VERSION')."; exit 1; fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then echo "::error::v$V already exists. Pick a higher version."; exit 1; fi
          else
            V="0.0.0-ci.${GITHUB_RUN_NUMBER}"
            # Pull requests: say whether merging will publish a release.
            if git ls-remote --exit-code --tags origin "refs/tags/v$FILE_V" >/dev/null; then
              echo "::notice::Merging won't release: v$FILE_V already exists. Bump VERSION to release."
            else
              echo "::notice::Merging this will release v$FILE_V."
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Building $V (publish: $PUBLISH)"

      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Tests
        run: python tests/test_core.py

      - name: Build and self-test
        shell: pwsh
        run: ./scripts/build.ps1 -Version ${{ steps.v.outputs.version }}

      - name: Keep the build
        if: steps.v.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RockCrawler-${{ steps.v.outputs.version }}
          path: dist/RockCrawler

      - uses: actions/setup-dotnet@v4
        if: steps.v.outputs.publish == 'true'
        with:
          dotnet-version: '8.0.x'

      - name: Package and publish the release
        if: steps.v.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install -g vpk --version $env:VPK_VERSION
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $repo = "https://github.com/${{ github.repository }}"
          $v = "${{ steps.v.outputs.version }}"

          # The previous release, so vpk can make a small delta update from it (none yet on the first release).
          vpk download github --repoUrl $repo --token $env:GH_TOKEN
          if ($LASTEXITCODE) { Write-Host "No earlier release to build a delta from." }

          vpk pack --packId $env:APP_ID --packVersion $v --packDir dist\RockCrawler `
            --mainExe RockCrawler.exe --packTitle "ASOP RockCrawler" --packAuthors "ASOP" --icon assets\asop.ico `
            --shortcuts StartMenuRoot
          if ($LASTEXITCODE) { throw "vpk pack failed" }

          # Releases started from main (merge or Run workflow): tag main now that the build and
          # package are good (a tag pushed with the workflow's own token doesn't start another run).
          if ("${{ github.ref_type }}" -ne "tag") {
            git tag "v$v"
            git push origin "v$v"
            if ($LASTEXITCODE) { throw "couldn't push tag v$v" }
          }

          vpk upload github --repoUrl $repo --publish --releaseName "ASOP RockCrawler $v" --tag "v$v" --token $env:GH_TOKEN
          if ($LASTEXITCODE) { throw "vpk upload failed" }

          # The installer again under a friendlier name, for the download link members click.
          Copy-Item "Releases\$env:APP_ID-win-Setup.exe" "Releases\RockCrawler-Setup.exe"
          gh release upload "v$v" "Releases\RockCrawler-Setup.exe" --clobber --repo "${{ github.repository }}"
